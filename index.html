"use strict";
const MOODS={wave:"lion-wave.webp",cheer:"lion-cheer.webp",wow:"lion-wow.webp",shy:"lion-shy.webp",sad:"lion-sad.webp",sleep:"lion-sleep.webp"};
Object.values(MOODS).forEach(src=>{const i=new Image();i.src=src;});
function lion(mood,cls,style,id){mood=MOODS[mood]?mood:"wave";return `<div class="lionbox ${cls||""}" data-base="${mood}" data-mood="${mood}" ${id?`id="${id}"`:""} style="${style||""}" role="img" aria-label="阿臭被"><div class="lshadow"></div><div class="lean"><div class="anim"><img src="${MOODS[mood]}" alt="" draggable="false"></div></div><div class="lsay"></div></div>`;}
const DAY = 864e5, WEEK = 7*DAY;
const CATS = [{k:"food",n:"食物",e:"food"},{k:"book",n:"書本",e:"book"},{k:"toy",n:"玩具",e:"teddy"},{k:"sub",n:"訂閱",e:"podcast"}];
const DEFAULT_SHOP = [
  ["food","yakult","養樂多",10],["food","pudding","布丁",20],["food","icecream","冰淇淋",30],["food","donut","甜甜圈",35],["food","eggcake","雞蛋糕",40],["food","strawberry","草莓盒",60],
  ["book","stickerbook","貼紙書",60],["book","crayon","著色本",80],["book","puzzle","拼圖書",120],["book","picturebook","繪本",150],
  ["toy","balloon","氣球",20],["toy","bubbles","泡泡水",40],["toy","capsule","扭蛋",150],["toy","car","小汽車",200],["toy","teddy","玩偶",250],["toy","blocks","積木小盒",300],
  ["sub","podcast","Podcast",100]
];
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ym = d => d.getFullYear()+"-"+pad(d.getMonth()+1);
function parseYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function lastPayday(now){const d=new Date(now);d.setHours(18,0,0,0);d.setDate(d.getDate()-d.getDay());if(d.getTime()>now)d.setDate(d.getDate()-7);return d;}

function defaultState(){
  const now=Date.now(); const lp=lastPayday(now); lp.setDate(lp.getDate()-7);
  return {
    v:1, updatedAt:0, kidName:"寶貝",
    spend:0, save:0, seeds:[],
    weekly:50, rate:0.825, mult:5, lockWeeks:2,
    lastPaid: ymd(lp),
    bank:{lastMonth: ym(new Date(now)), accrued:0},
    applied:[], shop: DEFAULT_SHOP.map(([cat,icon,name,price])=>({id:uid(),cat,icon,name,price})),
    wish:null, vouchers:[], log:[], shopFix1:true, shopFix2:true, mapStart: ym(new Date(now)), zoneBonus:0, zonesSeen:1, reveals:[], plantedTotal:0, treeSeen:0
  };
}
function iconOf(x){return (x&&(x.icon||EMOJI2ICON[x.emoji]))||"gift";}
function itemIcon(x){return ic(iconOf(x));}
function normalize(st){ if(!st.shopFix1&&Array.isArray(st.shop)){ st.shop.forEach(i=>{ if(i.name==="扭蛋"&&i.price===50) i.price=150; if(i.name==="小汽車"&&i.price===100) i.price=200; }); if(!st.shop.some(i=>i.cat==="sub")) st.shop.push({id:uid(),cat:"sub",icon:"podcast",name:"Podcast",price:100}); st.shopFix1=true; } if(!st.shopFix2&&Array.isArray(st.shop)){ st.shop.forEach(i=>{ if(i.name==="Podcast"&&i.price===30) i.price=100; }); st.shopFix2=true; }  if(st.plantedTotal==null){ const seedSum=(st.seeds||[]).reduce((a,x)=>a+(x.amount||0),0); let logSum=0; (st.log||[]).forEach(l=>{ if(l.type==="plant") logSum+=l.amt||0; if(l.type==="payday"){ const m=/搖錢樹 (\d+)/.exec(l.text||""); if(m) logSum+=+m[1]; } }); st.plantedTotal=Math.max(seedSum,logSum); st.treeSeen=treeStage(st.plantedTotal); } if(st.treeSeen==null) st.treeSeen=0; if(!st.mapStart) st.mapStart=ym(new Date()); if(st.zonesSeen==null) st.zonesSeen=1; if(st.zoneBonus==null) st.zoneBonus=0; if(!Array.isArray(st.reveals)) st.reveals=[]; (st.shop||[]).forEach(i=>{ if(!i.icon) i.icon=iconOf(i); }); (st.vouchers||[]).forEach(v=>{ if(!v.icon) v.icon=iconOf(v); }); return st; }
let state, market = {weeks:[]};
let ui = {screen:"home"};
let db=null, stateRef=null, marketRef=null, dbReady=false, syncNote="資料只存在這台裝置";
const LS="achoubei-v1";
try{ const s=localStorage.getItem(LS); state = s? normalize(JSON.parse(s)): defaultState(); }catch(e){ state=defaultState(); }
try{ const m=localStorage.getItem(LS+"-m"); if(m) market=JSON.parse(m);}catch(e){}

/* ---------- persistence ---------- */
let writeTimer=null, writing=false, writeAgain=false;
function save(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  if(!stateRef) return;
  clearTimeout(writeTimer); writeTimer=setTimeout(flush,500);
}
async function flush(){
  if(writing){writeAgain=true;return;}
  writing=true;
  try{ await stateRef.set(clone(state)); syncNote="已同步到雲端"; }
  catch(e){ syncNote = e&&e.code==="invalid_argument" ? "這個帳號只能看，不能存檔" : "暫時連不上雲端，先存在這台裝置"; }
  writing=false; updateSync();
  if(writeAgain){writeAgain=false;flush();}
}
function updateSync(){const el=document.getElementById("sync");if(el)el.textContent=syncNote;}
function log(type,text,amt){state.log.unshift({t:Date.now(),type,text,amt:amt||0});if(state.log.length>150)state.log.length=150;}

async function initDb(){
  try{ if(!window.claude||!claude.use) { standalone(); return; } db = await claude.use("db"); }catch(e){ db=null; }
  if(!db){ standalone(); return; }
  stateRef=db.doc("game/state"); marketRef=db.doc("market/0050");
  let timer=setTimeout(()=>{ if(!dbReady){ syncNote="雲端還沒連上，先用這台裝置的資料"; updateSync(); runAutomations(); } },10000);
  stateRef.onSnapshot(snap=>{
    if(snap.exists){
      const d=snap.data();
      if(!snap.metadata.hasPendingWrites && d && (d.updatedAt||0) > (state.updatedAt||0)){
        state=normalize(Object.assign(defaultState(),clone(d)));
        try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
        if(["home","bank","tree"].includes(ui.screen)) render();
      }
    }else if(!snap.metadata.fromCache){ save(); }
    if(!snap.metadata.fromCache && !dbReady){ dbReady=true; clearTimeout(timer); syncNote="已同步到雲端"; updateSync(); runAutomations(); }
  },err=>{ clearTimeout(timer); syncNote="雲端連線中斷，先存在這台裝置"; updateSync(); if(!dbReady) runAutomations(); });
  marketRef.onSnapshot(snap=>{
    if(snap.exists){ market=Object.assign({weeks:[]},clone(snap.data())); try{localStorage.setItem(LS+"-m",JSON.stringify(market));}catch(e){} if(automationsRan) applyMarket(true); }
  },()=>{});
}

/* ---------- standalone (home-screen app) ---------- */
let isApp=false;
function standalone(){
  isApp=true; syncNote="資料存在這台 iPad・記得在家長模式定期備份"; updateSync();
  runAutomations(); refreshMarket();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ refreshMarket(); payInterest(); if(["home","bank","tree"].includes(ui.screen)) render(); } });
  try{ if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost") && window.top===window) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
}
function mergeWeeks(list,src){
  if(!Array.isArray(list)||!list.length) return false; let changed=false; const have=new Map((market.weeks||[]).map(w=>[w.date,w]));
  list.forEach(w=>{ if(!w||!/^\d{4}-\d{2}-\d{2}$/.test(w.date)||!isFinite(w.pct)) return; if(!have.has(w.date)){ have.set(w.date,{date:w.date,pct:+(+w.pct).toFixed(2),close:w.close,source:src}); changed=true; } });
  if(changed){ market={...market,weeks:[...have.values()].sort((a,b)=>a.date<b.date?-1:1).slice(-80)}; try{localStorage.setItem(LS+"-m",JSON.stringify(market));}catch(e){} }
  return changed;
}
async function refreshMarket(){
  let changed=false;
  try{ const r=await fetch("market.json?t="+Date.now(),{cache:"no-store"}); if(r.ok){ const j=await r.json(); changed=mergeWeeks(j.weeks,"網站")||changed; } }catch(e){}
  try{ changed=mergeWeeks(await twseWeeks(),"證交所")||changed; }catch(e){}
  if(changed){ applyMarket(true); }
}
/* 0050 daily closes from TWSE → completed Mon–Fri weeks */
async function twseWeeks(){
  const now=new Date(), months=[new Date(now.getFullYear(),now.getMonth()-1,1),new Date(now.getFullYear(),now.getMonth(),1)];
  let rows=[];
  for(const m of months){
    const d=m.getFullYear()+pad(m.getMonth()+1)+"01";
    const r=await fetch(`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${d}&stockNo=0050`,{cache:"no-store"}); if(!r.ok) continue;
    const j=await r.json(); (j.data||[]).forEach(x=>{ const [y,mo,da]=String(x[0]).split("/").map(Number); const close=parseFloat(String(x[6]).replace(/,/g,"")); if(y&&isFinite(close)) rows.push({date:new Date(y+1911,mo-1,da),close}); });
  }
  rows.sort((a,b)=>a.date-b.date); if(rows.length<2) return [];
  const thisMon=weekStart(ymd(now)); const byWeek=new Map();
  rows.forEach(x=>{ const ws=weekStart(ymd(x.date)); if(ws<thisMon) byWeek.set(ws,x); });
  const weeks=[...byWeek.values()]; const out=[];
  for(let i=1;i<weeks.length;i++){ const a=weeks[i-1], b=weeks[i]; out.push({date:ymd(b.date),pct:(b.close/a.close-1)*100,close:b.close}); }
  return out;
}
/* backup / restore */
function backupCode(){ return JSON.stringify({app:"achoubei",v:1,at:Date.now(),state,market}); }
function restoreFrom(text){
  let j; try{ j=JSON.parse(String(text||"").trim()); }catch(e){ toast("備份碼看不懂，請重新複製","sad"); return false; }
  if(!j||j.app!=="achoubei"||!j.state||!Array.isArray(j.state.shop)){ toast("這不是阿臭被的備份","sad"); return false; }
  state=normalize(Object.assign(defaultState(),j.state)); state.updatedAt=Date.now();
  if(j.market&&Array.isArray(j.market.weeks)){ market=j.market; try{localStorage.setItem(LS+"-m",JSON.stringify(market));}catch(e){} }
  save(); toast("還原完成！","cheer"); return true;
}

/* ---------- automations: interest, market ---------- */
let automationsRan=false;
function runAutomations(){
  if(automationsRan) return; automationsRan=true;
  payInterest(); applyMarket(false); render();
}
function payInterest(){
  const cur=ym(new Date()); let last=state.bank.lastMonth||cur; let paid=0; let guard=0;
  while(last<cur && guard++<24){
    const [y,m]=last.split("-").map(Number); last=ym(new Date(y,m,1));
    state.bank.accrued += state.save*(state.rate*state.mult/100)/12;
    const p=Math.floor(state.bank.accrued+1e-9);
    if(p>0){state.save+=p;state.bank.accrued-=p;paid+=p;}
  }
  if(last!==state.bank.lastMonth){
    state.bank.lastMonth=last;
    if(paid>0){log("interest","銀行發利息",paid);setTimeout(()=>toast(`銀行發利息了！存款多了 ${paid} 元`,"cheer"),900);}
    save();
  }
}
function weekStart(dateStr){const d=parseYmd(dateStr);d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return d.getTime();}
function applyMarket(live){
  const weeks=(market.weeks||[]).filter(w=>w&&w.date&&isFinite(w.pct)).sort((a,b)=>a.date<b.date?-1:1);
  let changed=false, rev=null;
  for(const w of weeks){
    if(state.applied.includes(w.date)) continue;
    const ws=weekStart(w.date); const f=1+(w.pct*state.mult)/100; let hit=false; const before=treeTotal();
    for(const s of state.seeds){ if(s.plantedAt<ws){ s.value=Math.max(0,s.value*f); hit=true; } }
    state.applied.push(w.date); changed=true;
    if(hit){ if(!rev) rev={date:w.date,pct:w.pct,before}; rev.date=w.date; rev.pct=w.pct; rev.after=treeTotal(); }
  }
  if(state.applied.length>200) state.applied=state.applied.slice(-200);
  if(changed){
    if(rev){ state.reveals=[rev]; }
    save();
    if(live && ["home","tree"].includes(ui.screen)) render();
  }
}
function showReveal(){
  const rv=state.reveals&&state.reveals[0]; if(!rv) return false;
  const up=rv.pct>=0, k=up?"sun":"rain";
  const art=`<svg viewBox="0 0 400 260" class="rvsvg" aria-hidden="true"><g>${weatherArt(k,rv.pct,200,95,.75)}</g></svg>`;
  const line="這週搖錢樹的天氣是…？點雲朵把它吹走！";
  openModal(`<div class="sheet reveal" id="reveal"><div class="n">${ic("tree")} 搖錢樹開獎！</div>
    <div class="rvstage">${art}<div class="rvcloud k1" data-act="rvcloud" role="button">${ic("cloudbig")}</div><div class="rvcloud k2" data-act="rvcloud" role="button">${ic("cloudbig")}</div><div class="rvcloud k3" data-act="rvcloud" role="button">${ic("cloudbig")}</div></div>
    <div class="rvtext sub" id="rvtext">${line} ${sayBtn(line)}</div>
    <div class="rvnum" id="rvnum">${money(rv.before)} 元</div>
    <div class="btns" id="rvbtns" style="visibility:hidden"><button class="btn g" data-act="rvdone">${ic("check")} 好！</button></div></div>`);
  say(line); return true;
}
function rvReveal(){
  const rv=state.reveals[0]; if(!rv) return; const up=rv.pct>=0, d=money(rv.after)-money(rv.before);
  const box=document.getElementById("reveal"); if(!box) return; box.classList.add(up?"sunny":"rainy");
  sfx("spin"); if(up){ tada(); confetti(["sun","star","coin"]); }
  const num=document.getElementById("rvnum"), t0=performance.now(), from=rv.before, to=rv.after;
  (function f(now){const t=Math.min(1,(now-t0)/1200); num.textContent=money(from+(to-from)*(1-Math.pow(1-t,3)))+" 元"; if(t<1) requestAnimationFrame(f);})(t0);
  const msg = up? (d>0?`出太陽了！搖錢樹長大了 ${d} 元！`:"出太陽了！搖錢樹長得好好的！") : (d<0?`下雨了…搖錢樹變小了 ${-d} 元。不要怕，等太陽出來！`:"下雨了，搖錢樹淋了一點雨。");
  document.getElementById("rvtext").innerHTML=`${esc(msg)} ${sayBtn(msg)}`; say(msg);
  num.classList.add(up?"up":"down"); react(up?"cheer":"sad",up?"耶！太陽！":"下雨了…",2500);
  setTimeout(()=>{ const b=document.getElementById("rvbtns"); if(b) b.style.visibility="visible"; },900);
}
function pendingPaydays(){
  const cur=lastPayday(Date.now()); const lp=parseYmd(state.lastPaid); lp.setHours(18,0,0,0);
  return Math.max(0,Math.min(4,Math.round((cur-lp)/WEEK)));
}
const treeTotal = () => state.seeds.reduce((a,s)=>a+s.value,0);
const money = n => Math.round(n);
function weather(){
  const ws=(market.weeks||[]).filter(w=>w&&w.date).sort((a,b)=>a.date<b.date?1:-1);
  if(!ws.length) return {k:"cloud",e:ic("cloud"),t:"還沒有天氣消息"};
  return ws[0].pct>=0?{k:"sun",e:ic("sun"),t:"這週出太陽"}:{k:"rain",e:ic("rain"),t:"這週下雨"};
}

/* ---------- sound & voice ---------- */
let actx=null;
function clink(hi){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;[0,0.07].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=(hi?1700:1250)+i*500;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.3);});}catch(e){}}
function tada(){[0,.12,.24].forEach((d,i)=>setTimeout(()=>clink(i>1),d*1000));}
const canSpeak = (()=>{try{return "speechSynthesis" in window;}catch(e){return false;}})();

const STAGE_EN={"種子":"seed","小樹苗":"little sprout","小樹":"small tree","中樹":"medium tree","大樹":"big tree","搖錢大樹":"giant money tree"};
const ZONE_EN={"海邊":"beach","遊樂園":"amusement park"}, GAME_EN={"海浪撿貝殼":"Shell Catch","換你當店長":"Be the Shopkeeper"};

function toEn(zh){ zh=String(zh||"").trim(); for(const [re,fn] of EN_RULES){ const m=re.exec(zh); if(m) return fn(m); } return null; }
let enVoice=null;
const KID_PREF=["Nicky","Samantha","Ava","Allison","Susan","Zoe","Karen","Tessa","Moira","Kate","Serena","Google US English","Microsoft Jenny","Microsoft Aria"];
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); }catch(e){ return []; } }
function pickVoice(){ const vs=enVoices(); if(!vs.length) return;
  if(state.voiceName){ const m=vs.find(v=>v.name===state.voiceName); if(m){ enVoice=m; return; } }
  const score=v=>{ let sc=0; const i=KID_PREF.findIndex(p=>v.name.indexOf(p)>=0); if(i>=0) sc+=100-i*3; if(/premium|enhanced|natural|neural/i.test(v.name)) sc+=60; if(/en[-_]US/i.test(v.lang)) sc+=20; if(/female/i.test(v.name)) sc+=10;
    if(/compact|novelty|bells|bubbles|cellos|organ|whisper|zarvox|trinoids|bad news|good news|jester|superstar|wobble|boing|albert|bahh|fred|junior|ralph|grandpa|grandma|rocko|eddy|reed|sandy|shelley|flo/i.test(v.name)) sc-=500; return sc; };
  enVoice=vs.slice().sort((a,b)=>score(b)-score(a))[0]; }
if(canSpeak){ try{ speechSynthesis.addEventListener("voiceschanged",()=>{ pickVoice(); if(ui.screen==="parent") render(); }); }catch(e){} }
function speakEn(en){ if(!canSpeak||!en) return;
  try{ speechSynthesis.cancel(); pickVoice(); const u=new SpeechSynthesisUtterance(en); if(enVoice) u.voice=enVoice; u.lang=enVoice?enVoice.lang:"en-US";
    u.rate=state.voiceRate||.88; u.pitch=state.voicePitch||1.5; u.volume=1; speechSynthesis.speak(u);}catch(e){} }
function say(text){ speakEn(toEn(text)); }

function breakdown(n){n=Math.max(0,Math.round(n));const out=[];for(const c of [50,10,5,1]){while(n>=c){out.push(c);n-=c;}}return out;}
function coinEl(v,extra){extra=extra||""; let cls=""; extra=extra.replace(/class-x="([^"]*)"/,(m,c)=>{cls=" "+c;return "";}); return `<span class="coin c${v}${cls}" ${extra}>${v}</span>`;}
function coinsHTML(n,max){const b=breakdown(n);max=max||14;if(!b.length)return `<span class="sub">空空的</span>`;

  }else if(a.mode==="wd"||a.mode==="tree"){
    const tr=a.mode==="tree";
    line= tr?"要轉多少錢到搖錢樹？用下面的按鍵加加看！":"要領多少錢？用下面的按鍵加加看！";
    lcd=`<div class="l1">${tr?"轉進搖錢樹":"提款"}</div><div class="l2">${tr?"要轉多少錢？":"要領多少錢？"}</div><div class="big">${a.amt}<small> 元</small></div><div class="l4">存款還有 ${state.save-a.amt} 元</div>`;

      <div class="softkeys">${key("atmcancel",`${ic("cross")}<span>取消</span>`,"sk r")}${key("atmok",`${ic("check")}<span>確定</span>`,"sk g","",a.amt<=0)}</div>`;
  }else if(a.mode==="busy"){
    line="機器在動了…等一下下！"; lcd=`<div class="l1">處理中</div><div class="l2">請稍候…</div><div class="dots"><i></i><i></i><i></i></div>`;

function atmBeep(n,hi){ for(let k=0;k<(n||1);k++) setTimeout(()=>{ try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=hi?1560:1040;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.1);}catch(e){} },k*110); }
function atmPrint(){ for(let k=0;k<7;k++) setTimeout(()=>{ try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type="sawtooth";o.frequency.value=180+k*8;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.025,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.07);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.08);}catch(e){} },k*80); }
function atmFinish(kind,amt){
  const a=atmState(); a.mode="busy"; render(); atmBeep(2);
  const dispense = kind!=="dep";
  setTimeout(()=>{
    if(dispense){ const out=document.getElementById("cashout"); if(out){ breakdown(amt).slice(0,10).forEach((v,k)=>setTimeout(()=>{ out.insertAdjacentHTML("beforeend",coinEl(v,'class-x="pop" style="--s:1.1"')); clink(k%2===0); },k*140)); } }
  },500);
  setTimeout(()=>{
    if(kind==="dep"){ state.spend-=amt; state.save+=amt; log("move","ATM 存進銀行",amt); }
    else if(kind==="wd"){ state.save-=amt; state.spend+=amt; log("move","ATM 從銀行領出來",amt); }
    else { state.save-=amt; state.seeds.push({id:uid(),amount:amt,value:amt,plantedAt:Date.now()}); state.plantedTotal=(state.plantedTotal||0)+amt; log("plant","ATM 種搖錢樹（從銀行）",amt); }
    save(); a.mode="done"; a.rc={kind,amt,t:Date.now()}; a.amt=0; a.taken=[]; a.wallet=null;
    render(); atmPrint(); tada(); if(kind==="dep") confetti(["coin","star","bank"]);
  }, dispense?600+Math.min(10,breakdown(amt).length)*140+500:1100);
}

/* tree growth: size follows the total ever planted, never shrinks */
const TREE_STAGES=[{n:"種子",min:0},{n:"小樹苗",min:1},{n:"小樹",min:30},{n:"中樹",min:80},{n:"大樹",min:150},{n:"搖錢大樹",min:300}];
function treeStage(t){ t=t==null?(state.plantedTotal||0):t; const mins=[0,1,30,80,150,300]; let st=0; for(let i=1;i<mins.length;i++) if(t>=mins[i]) st=i; return st; }
const FRUIT_BOX=[null,[400,330,600,460],[410,270,590,410],[330,110,670,390],[220,40,780,350],[220,40,780,350]];
function treeArt(st,rain){
  const G=rain?"#4C8A33":"#5C9B3B", G2=rain?"#5E9A45":"#7DBB4E", Bk="#7A4B2A";
  const tick=(arr,w)=>`<g stroke="#fff" stroke-width="${w||4}" stroke-linecap="round" opacity=".75">${arr.map(([x,y])=>`<line x1="${x}" y1="${y}" x2="${x-5}" y2="${y+16}"/>`).join("")}</g>`;
  const mound=`<path d="M-130 4 C-100 -44 100 -44 130 4Z" fill="#8C5A3B"/>${[[-60,-14],[-10,-24],[50,-12],[20,-6]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#6E4428"/>`).join("")}`;
  if(st===0) return mound+`<ellipse cx="0" cy="-34" rx="16" ry="11" fill="#C98A12"/><path d="M-6 -40 q6 -6 12 0" stroke="#F3B228" stroke-width="3" fill="none"/>`;
  if(st===1) return mound+`<path d="M0 -24 C6 -60 -6 -90 0 -116" fill="none" stroke="${G}" stroke-width="10" stroke-linecap="round"/><path d="M0 -100 C-44 -100 -66 -132 -56 -156 C-22 -158 0 -130 0 -100Z" fill="${G}"/><path d="M0 -108 C44 -114 68 -146 58 -168 C22 -168 0 -140 0 -108Z" fill="${G2}"/>`;
  if(st===2) return mound+`<path d="M-11 0 L-8 -150 L8 -150 L11 0Z" fill="${Bk}"/><circle cx="-46" cy="-176" r="44" fill="${G}"/><circle cx="46" cy="-180" r="44" fill="${G}"/><circle cx="0" cy="-214" r="62" fill="${G2}"/>${tick([[-20,-240],[24,-226],[-50,-190],[40,-176]])}`;
  if(st===3) return `<path d="M-22 0 C-17 -90 -15 -170 -13 -230 L13 -230 C15 -170 17 -90 22 0Z" fill="${Bk}"/><path d="M0 -150 L-60 -200 M0 -170 L64 -214" stroke="${Bk}" stroke-width="14" stroke-linecap="round"/><circle cx="-92" cy="-250" r="78" fill="${G}"/><circle cx="92" cy="-252" r="78" fill="${G}"/><circle cx="0" cy="-300" r="108" fill="${G2}"/><circle cx="-40" cy="-212" r="62" fill="${G}"/><circle cx="46" cy="-210" r="62" fill="${G}"/>${tick([[-60,-330],[20,-360],[70,-300],[-110,-260],[110,-250],[-20,-250],[40,-230]])}`;
  const big=`<path d="M-25 0 C-20 -90 -30 -140 -45 -190 L45 -190 C30 -140 20 -90 25 0Z" fill="${Bk}"/><path d="M0 -160 L-80 -220 M0 -140 L90 -210" stroke="${Bk}" stroke-width="22" stroke-linecap="round"/><path d="M0 -480 C140 -490 290 -410 280 -300 C300 -200 150 -150 0 -170 C-150 -150 -300 -200 -280 -300 C-290 -410 -140 -490 0 -480Z" fill="${G}"/>${tick([[-170,-400],[-100,-430],[120,-420],[190,-360],[-200,-290],[200,-260],[60,-220],[-80,-220],[-140,-350],[150,-310]])}`;
  if(st===4) return big;
  return `<circle cx="0" cy="-320" r="330" fill="none" stroke="#F3B228" stroke-width="14" opacity=".35"/>`+big+[[-230,-470],[250,-450],[-300,-250],[300,-200],[0,-520]].map(([x,y])=>`<path d="M${x} ${y-22} L${x+7} ${y-7} L${x+22} ${y} L${x+7} ${y+7} L${x} ${y+22} L${x-7} ${y+7} L${x-22} ${y} L${x-7} ${y-7}Z" fill="#F3B228"/>`).join("");
}
function growCard(){
  const st=treeStage(), t=state.plantedTotal||0, nx=TREE_STAGES[st+1];
  if(!nx) return `<div class="card growcard"><div class="gt">${ic("star")} ${TREE_STAGES[st].n}</div><div class="sub">已經長到最大了！好厲害！</div></div>`;
  const lo=TREE_STAGES[st].min, pct=Math.max(4,Math.min(100,(t-lo)/(nx.min-lo)*100));
  return `<div class="card growcard"><div class="gt">${ic("sprout")} 現在是${TREE_STAGES[st].n}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="sub">${st===0?"種下第一筆錢，就會冒出小樹苗！":`再種 ${nx.min-t} 元，會長成${nx.n}！`}</div></div>`;
}
function checkGrow(){ const st=treeStage(); if(st>(state.treeSeen||0)&&!document.querySelector(".modal")){ showGrow(state.treeSeen||0,st); return true; } return false; }
function showGrow(from,to){
  const line=`搖錢樹長大了！變成${TREE_STAGES[to].n}！`;
  const art=s=>`<svg viewBox="-360 -620 720 660" class="growsvg" aria-hidden="true"><g filter="url(#rough2)"><g transform="scale(${[1.4,1.3,1.2,1,.95,.9][s]})">${treeArt(s,false)}</g></g></svg>`;
  openModal(`<div class="sheet grow"><div class="n">${ic("sprout")} 搖錢樹長大了！</div><div class="growstage" id="growstage">${art(from)}</div><div class="sub" id="growtext">咦？搖錢樹好像在動…</div><div class="btns" id="growbtns" style="visibility:hidden"><button class="btn g" data-act="growdone" data-to="${to}">${ic("check")} 好棒！</button></div></div>`);
  setTimeout(()=>{ const g=document.getElementById("growstage"); if(!g) return; g.classList.add("shake"); sfx("boing"); },500);
  setTimeout(()=>{ const g=document.getElementById("growstage"); if(!g) return; g.classList.remove("shake"); g.innerHTML=art(to); g.classList.add("grown"); sfx("spin"); tada(); confetti(["sprout","star","coin"]);
    document.getElementById("growtext").innerHTML=`${esc(line)} ${sayBtn(line)}`; say(line); react("cheer","長大了！",2000);
    document.getElementById("growbtns").style.visibility="visible"; },1500);
}

function tree(){

    <path d="M-40 560 C120 470 300 520 500 500 C700 480 860 440 1040 470 L1040 600 L-40 600Z" fill="#5C9B3B"/>
    <path d="M-60 600 C160 520 380 590 560 560 C760 528 880 560 1060 520" fill="none" stroke="#EE4524" stroke-width="60" stroke-linecap="round"/>
    <g transform="translate(500 520)">${treeArt(treeStage(),w.k==="rain")}</g>
    ${pine(900,470,130)}${pine(80,500,100)}
  </g></svg>
    <div class="fruits" style="${fbox}">${fruits}</div>
    ${lion(w.k==="rain"?"sad":w.k==="sun"?"cheer":"wow","treelion")}
  </div></main>
  <aside class="side"><div class="bubble">${esc(line)}${sayBtn(line)}</div>${growCard()}
  <div class="split">
    <div class="card green center"><div class="sub">搖錢樹上的錢</div><div class="bigamt">${money(total)}<small> 元</small></div>
      <div class="sub" style="font-size:20px">種下去 ${cost} 元，${diff>=0.5?`<span class="up">多了 ${money(diff)} 元 ${ic("up")}</span>`:diff<=-0.5?`<span class="down">少了 ${money(-diff)} 元 ${ic("down")}</span>`:"差不多一樣"}</div>
      <div class="wk">${hist.map(h=>`<span>${ic(h.pct>=0?"sun":"rain")} ${h.date.slice(5).replace("-","/")}</span>`).join("")}</div></div>

let gameTimer=null;
function setupBeach(){
  const st=document.getElementById("stage"), bq=document.getElementById("bq"), tray=document.getElementById("tray"), tsum=document.getElementById("tsum");
  const T=[[6,7,9],[11,12,15],[16,18,21]]; let round=0, target=0, got=[], lock=false;
  const sum=()=>got.reduce((a,b)=>a+b,0);
  function show(){ const line=`第 ${round+1} 關：撿到剛好 ${target} 元！`; bq.innerHTML=`<span class="sub">第 ${round+1} 關 / 3</span><br>撿到剛好 <b class="goal">${target} 元</b>！ ${sayBtn(line)}`;
    tray.innerHTML=got.map((v,i)=>coinEl(v,`data-i="${i}" style="--s:1.2"`)).join(""); tsum.textContent=sum()+" 元"; }
  function next(){ target=pick(T[round]); got=[]; lock=false; show(); say(`撿到剛好 ${target} 元！`); }
  tray.onclick=e=>{ const c=e.target.closest(".coin"); if(!c||lock) return; got.splice(+c.dataset.i,1); sfx("thud"); show(); };
  function spawn(){
    if(!document.body.contains(st)){ clearInterval(gameTimer); return; }
    const v=pick([1,1,1,5,5,10]), lane=pick([16,34,52]);
    const sh=document.createElement("button"); sh.className="shellbtn"; sh.style.top=lane+"%"; sh.style.animationDuration=(6+Math.random()*2)+"s";
    sh.innerHTML=`${ic("shell")}${coinEl(v,'style="--s:1.05"')}`;
    sh.onpointerdown=ev=>{ ev.stopPropagation(); if(lock||sh.dataset.got) return; sh.dataset.got=1; sh.classList.add("got"); setTimeout(()=>sh.remove(),400);
      got.push(v); sfx("star"); show(); const t=sum();
      if(t===target){ lock=true; tada(); react("cheer",pick(["剛剛好！","好厲害！","答對了！"]),1300); confetti(["shell","coin","star"]);
        setTimeout(()=>{ round++; if(round<3) next(); else { clearInterval(gameTimer); starsGot+=3; finishGame("撿貝殼高手！得到 3 顆星星！",["shell","star","coin"]); } },1400); }
      else if(t>target){ lock=true; react("sad","太多了！放回去一個",1400); setTimeout(()=>{ got.pop(); lock=false; show(); },900); }
      else react("wow",null,500);
    };
    sh.addEventListener("animationend",()=>sh.remove());
    st.appendChild(sh);
  }
  clearInterval(gameTimer); next(); spawn(); gameTimer=setInterval(spawn,950);
}

function flyCoin(fromEl,toEl,v,done){
  if(!fromEl||!toEl){done();return;}
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
  const f=document.createElement("div");f.className="fly";f.innerHTML=coinEl(v,'style="--s:1.6"');f.style.left=a.left+"px";f.style.top=a.top+"px";document.body.appendChild(f);
  fromEl.style.visibility="hidden";
  requestAnimationFrame(()=>{f.style.transform=`translate(${b.left+b.width/2-a.left-38}px,${b.top+b.height/2-a.top-38}px) scale(.7)`;});
  setTimeout(()=>{f.remove();done();},560);
}

/* tween the squash/stretch/jump state of a lion */
function tween(box,dur,fn){return new Promise(res=>{ if(!box){res();return;} const mv=box._mv||(box._mv=MV0()); mv.on=true; const t0=performance.now();
  (function f(now){ const t=Math.min(1,(now-t0)/dur); fn(t,mv); if(t<1) requestAnimationFrame(f); else res(); })(t0); });}
function rest(box){ if(box&&box._mv){ Object.assign(box._mv,MV0()); } }
function puffAt(xp,yp,n){ const m=worldEl(); if(!m) return; for(let i=0;i<(n||2);i++){ const d=document.createElement("div"); d.className="puff"; d.style.left=(xp+(i?.55:-.55))+"%"; d.style.top=yp+"%"; d.style.setProperty("--dx",(i?1:-1)*18+"px"); m.appendChild(d); setTimeout(()=>d.remove(),600);} }
async function crouch(box,ms){ await tween(box,ms||120,(t,mv)=>{ const k=Math.sin(Math.PI*t); mv.sy=1-.18*k; mv.sx=1+.14*k; mv.jy=0; }); }

/* hop along the road from current L to `to` */
/* walk along the road: steady waddle, small bob each step, no jumping */
async function hopTo(to,opts){
  opts=opts||{}; const r=ensureLion(); if(!r) return false;
  const tok=++moveTok; moving=true; const box0=mapBox(); if(box0) box0.classList.add("walking");
  const from=mapLion.L, D=Math.abs(to-from); if(D<2){ moving=false; if(box0) box0.classList.remove("walking"); return true; }
  const speed=opts.speed||340, dur=Math.max(500,Math.min(5200,D/speed*1000)), stepLen=58;
  const sgn=to>from?1:-1, p0=r.getPointAtLength(from), p1=r.getPointAtLength(Math.min(r.getTotalLength(),Math.max(0,from+sgn*6)));
  if(Math.abs(p1.x-p0.x)>.3) mapLion.dir=p1.x>p0.x?1:-1;
  /* lean in to start */
  await tween(mapBox(),140,(t,mv)=>{ mv.rot=mapLion.dir*7*t; mv.sy=1-.05*Math.sin(Math.PI*t); mv.jy=0; });
  if(tok!==moveTok) return false;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  let lastStep=0;
  await tween(mapBox(),dur,(t,mv)=>{
    if(tok!==moveTok) return;
    const l=from+(to-from)*ease(t); const p=placeAt(l);
    const q=r.getPointAtLength(Math.min(r.getTotalLength(),Math.max(0,l+sgn*5))); if(p&&Math.abs(q.x-p.x)>.4) mapLion.dir=q.x>p.x?1:-1;
    const ph=Math.abs(l-from)/stepLen*Math.PI, sw=Math.sin(ph);
    mv.jy=Math.abs(sw)*5; mv.rot=mapLion.dir*5+sw*6; mv.sy=1-.035*Math.abs(Math.cos(ph)); mv.sx=1+.025*Math.abs(Math.cos(ph));
    const step=Math.floor(Math.abs(l-from)/stepLen); if(step!==lastStep){ lastStep=step; sfx("step"); if(step%2===0) puffAt(mapLion.x,mapLion.y,1); }
  });
  if(tok!==moveTok) return false;
  /* settle */
  await tween(mapBox(),200,(t,mv)=>{ const k=Math.sin(Math.PI*t); mv.jy=0; mv.rot=mapLion.dir*5*(1-t); mv.sy=1-.08*k; mv.sx=1+.06*k; });
  if(tok!==moveTok) return false;
  const box=mapBox(); if(box) box.classList.remove("walking"); rest(box); moving=false; return true;
}
async function happyWiggle(box){

  rest(box); box.classList.remove("walking"); box._busy=false;
}

  const o=zonesOpen(); if(automationsRan && (state.zonesSeen||1)<o){ const z=(state.zonesSeen||1); showUnlock(z); }
}
function showUnlock(z){
  const zn=ZONES[z]; const line=`新地圖開放了！${zn.n}有新的小遊戲「${zn.gn}」！`;
  openModal(`<div class="sheet unlock"><div class="ulart">${ic(z===1?"shell":"ferris")}</div>${lion("cheer","","width:160px;margin:-10px auto 0")}<div class="n">新地圖：${zn.n}！</div><div class="sub">${esc(line)} ${sayBtn(line)}</div><div class="btns"><button class="btn g" data-act="zonego" data-z="${z}">${ic("next")} 去看看！</button></div></div>`);
  confetti(["star","heart",z===1?"shell":"ferris"]); tada(); say(line);
}
/* idle: wander a little now and then */
setInterval(()=>{ const now=Date.now();
  if(ui.screen!=="home"||moving||sleeping||document.querySelector(".modal")) return;
  if(now-lastAct<6000||now-lastWander<7000+Math.random()*6000) return;
  lastWander=now; const r=road(); if(!r||mapLion.L==null) return; const [lo,hi]=getRange(r);
  if(Math.random()<.35){ lookAround(mapBox()); return; }
  const to=clamp(mapLion.L+(Math.random()<.5?-1:1)*(60+Math.random()*90),lo,hi); hopTo(to,{speed:200}).then(ok=>{ if(ok){ const b=mapBox(); setMood(b,b?b.dataset.base:"wave"); } });
},1000);

/* ---------- 阿臭被 character engine ---------- */
function baseMood(){
  switch(ui.screen){
    case "home": { if(pendingPaydays()>0) return "cheer"; const w=state.wish&&state.shop.find(i=>i.id===state.wish); if(w&&state.spend+state.save>=w.price) return "cheer"; if(weather().k==="rain"&&state.seeds.length) return "sad"; return "wave"; }
    case "tree": { const k=weather().k; return k==="rain"?"sad":k==="sun"?"cheer":"wow"; }
    case "bank": case "move": return "shy";
    case "bought": return "cheer";
    default: return "wave";
  }
}
const LINES={
  tap:["嘻嘻，好癢！","我是阿臭被！","抱抱～","要一起存錢嗎？","你今天好棒！","哇！嚇我一跳！","我最喜歡你了！","錢要好好用喔！"],
  wake:["啊！我醒了！","呼～睡飽了！"],
  shop:["去買東西囉！"],bank:["存起來，慢慢變多！"],tree:["去看搖錢樹！"],payday:["發錢囉！"],home:["回家囉～"],
  nomoney:["錢不夠耶…","再存一下下！"],right:["答對了！","好聰明！"],wrong:["嗯…再想想？"]
};
const pick=a=>a[Math.floor(Math.random()*a.length)];
let moodTimer=null, lastAct=Date.now(), sleeping=false;
function setMood(box,mood){
  if(!box||!MOODS[mood]||box.dataset.mood===mood) return;
  box.dataset.mood=mood; const img=box.querySelector("img");
  img.src=MOODS[mood]; img.classList.remove("pop"); void img.offsetWidth; img.classList.add("pop");
}
function moodAll(mood,ms){
  clearTimeout(moodTimer);
  document.querySelectorAll(".lionbox").forEach(b=>setMood(b,mood));
  if(ms) moodTimer=setTimeout(()=>{ if(!sleeping) document.querySelectorAll(".lionbox").forEach(b=>setMood(b,b.dataset.base)); },ms);
}
function lionSay(text,box){
  const boxes=box?[box]:[...document.querySelectorAll(".lionbox")].filter(b=>!b.closest(".toast")).slice(-1);
  boxes.forEach(b=>{const el=b.querySelector(".lsay"); if(!el) return; el.textContent=text; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),1800);});
}
function react(mood,line,ms){ ms=ms||1600; moodAll(mood,ms); if(line) lionSay(line); carry={mood,line,until:Date.now()+ms}; }
let carry=null;
function applyCarry(){ if(!carry||Date.now()>carry.until) return; const c=carry; moodAll(c.mood,c.until-Date.now()); if(c.line) lionSay(c.line); }
function moodForEl(el){
  if(el.disabled) return ["sad",pick(LINES.nomoney)];
  const s=el.dataset.s, a=el.dataset.act;
  if(s==="shop") return ["cheer",pick(LINES.shop)];
  if(s==="bank") return ["shy",pick(LINES.bank)];
  if(s==="tree") return ["wow",pick(LINES.tree)];
  if(s==="payday") return ["cheer",pick(LINES.payday)];
  if(s==="home") return ["wave",null];
  if(a==="item") return el.classList.contains("cant")?["shy",null]:["cheer",null];
  if(a==="pk"||a==="pdput") return ["wow",null];
  if(a==="pkback"||a==="pdundo") return ["shy",null];
  if(a==="gate") return ["shy",null];
  if(el.classList.contains("g")) return ["cheer",null];
  if(el.classList.contains("r")) return ["wow",null];
  return null;
}
/* pointer tracking: lean / shift / turn toward the finger or mouse */
let ptr=null;
function onPtr(e){
  ptr={x:e.clientX,y:e.clientY,t:Date.now()}; lastAct=Date.now();
  if(sleeping){ sleeping=false; document.querySelectorAll(".lionbox").forEach(b=>setMood(b,"wow")); lionSay(pick(LINES.wake)); clearTimeout(moodTimer); moodTimer=setTimeout(()=>document.querySelectorAll(".lionbox").forEach(b=>setMood(b,b.dataset.base)),1400); }
}
window.addEventListener("pointermove",e=>{ onPtr(e);
  if(pan){ const dx=e.clientX-pan.x; if(Math.abs(dx)>12) pan.moved=true; if(pan.moved){ const m=mapEl(); if(m){ const rc=m.getBoundingClientRect(); camT=camX=clamp(pan.cam-dx/rc.width*ZW,0,maxCam()); applyCam(); } } }
  if(drag) moveDrag(e);
},{passive:true});
window.addEventListener("pointerup",e=>{
  if(pan){ const p0=pan; pan=null; if(!p0.moved) mapTap(e); else { const lastOpen=(zonesOpen()-1)*ZW; if(camT>lastOpen+40){ peekLocked(); } else { const z=Math.round(camT/ZW); camT=clamp(z*ZW,0,maxCam()); } } }
  if(drag) endDrag(e);
},{passive:true});
window.addEventListener("pointercancel",()=>{ pan=null; if(drag) cancelDrag(); },{passive:true});
/* payday: drag a coin into a jar */
let drag=null;
function startDrag(e,el){
  const r=el.getBoundingClientRect(); const g=el.cloneNode(true); g.classList.add("ghost"); g.classList.remove("drop");
  g.style.left=r.left+"px"; g.style.top=r.top+"px"; g.style.width=r.width+"px"; g.style.height=r.height+"px"; document.body.appendChild(g);
  el.style.visibility="hidden"; drag={el,g,i:+el.dataset.i,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height}; clink(); react("wow","拖到罐子裡！",900);
}
function jarAt(x,y){ const t=document.elementFromPoint(x,y); return t&&t.closest('[data-act="pdput"]'); }
function moveDrag(e){ const d=drag; d.g.style.left=(e.clientX-d.ox)+"px"; d.g.style.top=(e.clientY-d.oy)+"px"; const j=jarAt(e.clientX,e.clientY);
  document.querySelectorAll(".jar.over").forEach(x=>{ if(x!==j) x.classList.remove("over"); }); if(j) j.classList.add("over"); }
function endDrag(e){ const d=drag; drag=null; const j=jarAt(e.clientX,e.clientY); document.querySelectorAll(".jar.over").forEach(x=>x.classList.remove("over"));
  const pd=ui.pd;
  if(j&&pd&&pd.left[d.i]!=null){ const v=pd.left[d.i]; pd.left.splice(d.i,1); pd[j.dataset.k].push(v); d.g.remove(); sfx("star");
    render(); const nj=document.getElementById("pd-"+j.dataset.k); if(nj){ nj.classList.add("bounce1"); setTimeout(()=>nj.classList.remove("bounce1"),400); }
    if(!pd.left.length){ tada(); confetti(["coin","star","heart"]); say("分好了！按完成就放進去囉！"); react("cheer","分好了！",1500); }
  } else { d.g.classList.add("back"); const r=d.el.getBoundingClientRect(); d.g.style.left=r.left+"px"; d.g.style.top=r.top+"px"; setTimeout(()=>{ d.g.remove(); d.el.style.visibility=""; },260); sfx("thud"); }
}
function cancelDrag(){ const d=drag; drag=null; if(!d) return; d.g.remove(); d.el.style.visibility=""; }
window.addEventListener("pointerdown",e=>{
  onPtr(e);
  const box=e.target.closest(".lionbox");
  if(box){ if(box.classList.contains("walking")||box._busy) return;
    const m=pick(["cheer","wow","shy"]); moodAll(m,1500); lionSay(pick(LINES.tap),box); spinJump(box,true); return; }
  if(ui.screen==="home" && e.target.closest("[data-map]") && !e.target.closest("button,.cloudsay,.starchip,.lionbox")){ pan={x:e.clientX,y:e.clientY,cam:camT,moved:false}; return; }
  const dc=e.target.closest(".dragcoin"); if(dc&&ui.screen==="payday"){ startDrag(e,dc); return; }
  const el=e.target.closest("button,[data-act]"); if(!el) return;
  const r=moodForEl(el); if(r) react(r[0],r[1],1400);
},{passive:true});
window.addEventListener("pointerover",e=>{
  if(e.pointerType!=="mouse") return;
  const el=e.target.closest("button"); if(!el||el===window._hov) return; window._hov=el;
  const r=moodForEl(el); if(r) moodAll(r[0],1200);
},{passive:true});
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function tick(){
  const now=Date.now();
  if(ui.screen==="home"&&!pan&&Math.abs(camX-camT)>.3){ camX=lerp(camX,camT,.12); applyCam(); }
  if(!sleeping && now-lastAct>40000 && !document.querySelector(".modal") && ["home","bank","tree","shop"].includes(ui.screen)){
    sleeping=true; clearTimeout(moodTimer); document.querySelectorAll(".lionbox").forEach(b=>setMood(b,"sleep"));
  }
  const active=ptr && now-ptr.t<6000 && !sleeping;
  document.querySelectorAll(".lionbox").forEach((b,i)=>{
    const lean=b.querySelector(".lean"); const r=b.getBoundingClientRect(); if(!r.width) return;
    const cx=r.left+r.width/2, cy=r.top+r.height*.35;
    const st=b._st||(b._st={rot:0,tx:0,ty:0,fx:1,near:false});
    let rot=0,tx=0,ty=0,fx=st.fx<0?-1:1;
    const mv=b._mv||MV0();
    if(b.classList.contains("walking")){
      fx=b.classList.contains("maplion")?mapLion.dir:fx; st.rot=lerp(st.rot,0,.3); st.tx=lerp(st.tx,0,.3); st.ty=lerp(st.ty,0,.3); st.fx=lerp(st.fx,fx,.4);
      const sxw=Math.abs(st.fx)<.2?(st.fx<0?-.2:.2):st.fx;
      lean.style.transform=`translate(${st.tx.toFixed(1)}px,${(st.ty-mv.jy).toFixed(1)}px) rotate(${(st.rot+mv.rot).toFixed(2)}deg) scale(${(sxw*mv.sx).toFixed(3)},${mv.sy.toFixed(3)})`;
      const sh=b.querySelector(".lshadow"); if(sh) sh.style.transform=`translateX(-50%) scale(${Math.max(.45,1-mv.jy/(r.width*.7)).toFixed(3)})`;
      return;
    }
    if(b.classList.contains("maplion")&&!active&&mapLion.dir<0) fx=-1;
    if(active){
      const dx=ptr.x-cx, dy=ptr.y-cy, d=Math.hypot(dx,dy);
      rot=clamp(dx/28,-13,13); tx=clamp(dx/16,-r.width*.09,r.width*.09); ty=clamp(dy/26,-10,10);
      if(dx<-r.width*.35) fx=-1; else if(dx>r.width*.35) fx=1;
      const near=d<r.width*.75;
      if(near&&!st.near&&!b.closest(".toast")&&b.dataset.mood!=="sleep"){ setMood(b,"wow"); clearTimeout(b._nt); b._nt=setTimeout(()=>{ if(!sleeping) setMood(b,b.dataset.base); },900); }
      st.near=near;
    }else{
      const t=now/1000+i*1.7; rot=Math.sin(t*.7)*4; tx=Math.sin(t*.45)*6; ty=0; st.near=false;
    }
    if(sleeping){ rot=0; tx=0; ty=0; }
    st.rot=lerp(st.rot,rot,.12); st.tx=lerp(st.tx,tx,.12); st.ty=lerp(st.ty,ty,.12); st.fx=lerp(st.fx,fx,.16);
    const sx=Math.abs(st.fx)<.15?(st.fx<0?-.15:.15):st.fx;
    lean.style.transform=`translate(${st.tx.toFixed(1)}px,${(st.ty-mv.jy).toFixed(1)}px) rotate(${(st.rot+mv.rot).toFixed(2)}deg) scale(${(sx*mv.sx).toFixed(3)},${mv.sy.toFixed(3)})`;
    const sh=b.querySelector(".lshadow"); if(sh) sh.style.transform=`translateX(-50%) scale(${Math.max(.45,1-mv.jy/(r.width*.7)).toFixed(3)})`;
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
render();
initDb();
</script>
</body>
</html>
